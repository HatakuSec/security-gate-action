name: traversal wrapper remote
description: remote composite traversal wrapper
runs:
  using: composite
  steps:
    - name: Preload setup-node v4 SHA from remote composite
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'

    - name: Pinned v3 SHA-looking setup-node reference traverses to v4 SHA
      uses: actions/setup-node/../49933ea5288caeca8642d1e84afbd3f7d6820020@3235b876344d2a9aa001b8d1453c930bba69e610
      with:
        node-version: '20'
